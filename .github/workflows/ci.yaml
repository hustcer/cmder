name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, native, wasm-gc]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Moon update
        run: moon update
      - name: Moon check
        run: moon check --deny-warn --target ${{ matrix.target }}
      - name: Moon test
        run: moon test --target ${{ matrix.target }}
      - name: Install completion test shells
        if: matrix.target == 'native'
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - name: Install Nushell
        if: matrix.target == 'native'
        uses: hustcer/setup-nu@v3
        with:
          version: '0.116.0'
      - name: Test generated completions
        if: matrix.target == 'native'
        run: nu scripts/check-completions.nu
